/* ---------- cloud sync (Firebase Realtime Database over REST) ---------- */
var DB_URL='https://qaisar-we-default-rtdb.europe-west1.firebasedatabase.app';
var COLS=['students','codes','videos','log'];
var synced={},pending=0,lastWrite=0,ready=false,remoteEmpty=false,needRender=false,retryT=null,online=true;
function canon(v){
  if(Array.isArray(v)){return '['+v.map(canon).join(',')+']';}
  if(v&&typeof v==='object'){return '{'+Object.keys(v).sort().map(function(k){return JSON.stringify(k)+':'+canon(v[k]);}).join(',')+'}';}
  return JSON.stringify(v);
}
function keyOf(col,it){return col==='codes'?it.code:(col==='log'?it.k:it.id);}
function badKey(k){return !k||/[.$#\[\]\/]/.test(k);}
function snapshot(){
  var m={};
  COLS.forEach(function(c){db[c].forEach(function(it){var k=keyOf(c,it);if(!badKey(k)){m[c+'/'+k]=canon(it);}});});
  m['announce']=canon({text:db.announce.text,ts:db.announce.ts});
  return m;
}
function isDirty(){
  var cur=snapshot(),p;
  for(p in cur){if(synced[p]!==cur[p]){return true;}}
  for(p in synced){if(!(p in cur)){return true;}}
  return false;
}
function pushChanges(){
  if(!ready){return;}
  var cur=snapshot(),patch={},paths=[],p;
  for(p in cur){if(synced[p]!==cur[p]){patch[p]=JSON.parse(cur[p]);paths.push(p);}}
  for(p in synced){if(!(p in cur)){patch[p]=null;paths.push(p);}}
  if(!paths.length){return;}
  pending++;
  authUrl('/.json').then(function(u){return fetch(u,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});})
  .then(function(r){
    if(!r.ok){var er=new Error('http '+r.status);er.st=r.status;throw er;}
    paths.forEach(function(q){if(q in cur){synced[q]=cur[q];}else{delete synced[q];}});
    online=true;
  })
  .catch(function(e){
    var st=e&&e.st;
    if((st===401||st===403)&&isAdm()){
      T=null;try{localStorage.removeItem(KEY+'_t');}catch(x){}
      db.session=null;try{writeRaw(JSON.stringify(db));}catch(x){}
      toast('الحفظ مرفوض ('+st+'): سجّل دخول الأدمن تاني، ولو اتكرر راجع القواعد');
      needRender=true;
      return;
    }
    if(online){toast('تعذر الحفظ على السيرفر'+(st?' ('+st+')':'')+'، هنعيد المحاولة');}
    online=false;
    clearTimeout(retryT);retryT=setTimeout(function(){pushChanges();},8000);
  })
  .then(function(){pending--;lastWrite=Date.now();});
}
function fromRemote(r){
  var d={session:db.session,students:[],codes:[],videos:[],log:[],announce:{text:'',ts:0}};
  r=(r&&typeof r==='object')?r:{};
  COLS.forEach(function(c){
    var o=r[c];
    d[c]=(o&&typeof o==='object')?Object.keys(o).map(function(k){return o[k];}):[];
  });
  if(r.announce&&typeof r.announce==='object'){d.announce=r.announce;}
  d=normalize(d);
  d.students.sort(function(a,b){return a.id<b.id?-1:(a.id>b.id?1:0);});
  d.codes.sort(function(a,b){return a.ts-b.ts;});
  d.videos.sort(function(a,b){return a.ts-b.ts;});
  d.log.sort(function(a,b){return a.ts-b.ts;});
  return d;
}
function localHasData(){return db.students.length||db.codes.length||db.videos.length||db.log.length||db.announce.text;}
function applyRemote(r,first){
  var empty=!r||typeof r!=='object'||!Object.keys(r).length;
  if(first){
    remoteEmpty=empty;
    if(empty){
      // server فاضي: نسيب اللي في المتصفح كما هو، والأدمن هيرفعه عند الدخول
      synced=snapshot();
      if(isAdm()&&localHasData()){synced={};}
      ready=true;
      if(db.session&&db.session.role==='admin'){pushChanges();}
      return true;
    }
  }
  if(empty){return false;}
  if(pending>0||Date.now()-lastWrite<1500||(ready&&isDirty())){return false;}
  var nd=fromRemote(r),old=db;
  db=nd;
  var ns=snapshot();
  var changed=!ready;
  if(ready){
    var p;
    for(p in ns){if(synced[p]!==ns[p]){changed=true;break;}}
    if(!changed){for(p in synced){if(!(p in ns)){changed=true;break;}}}
  }
  synced=ns;ready=true;
  if(!changed){db=old;db.session=old.session;return false;}
  try{writeRaw(JSON.stringify(db));}catch(e){}
  return true;
}
function maybeRender(){

function getJ(path){
  return authUrl(path).then(function(u){return fetch(u,{cache:'no-store'});})
  .then(function(r){if(!r.ok){throw new Error('http '+r.status);}return r.json();});
}
function pull(first){
  var p;
  if(isAdm()){p=getJ('/.json');}
  else if(isStu()){
    var id=db.session.id;
    p=Promise.all([getJ('/students/'+id+'.json'),getJ('/announce.json'),getJ('/videos.json')]).then(function(a){
      var r={announce:a[1]||{text:'',ts:0}};
      if(a[0]){r.students={};r.students[id]=a[0];}
      if(a[2]){r.videos=a[2];}

  }else{
    if(first){ready=true;synced=snapshot();render();}

  }
  return p

    var ch=applyRemote(j,first);
    if(first||ch){maybeRender();}

  .catch(function(){
    if(first){ready=true;synced=snapshot();toast('مفيش اتصال بالسيرفر، البيانات ممكن تكون قديمة');render();}

function startSync(){

/* ---------- actions ---------- */
function act(a,el){
  var id=el.getAttribute('data-id'),s,v,n;
  switch(a){
    case 'submitForm':{
      var ff=el.closest('form');
      if(ff&&forms[ff.getAttribute('data-form')]){forms[ff.getAttribute('data-form')](ff);}
      break;}
    case 'crest':
      n=Date.now();
      if(n-lastTap>1500){taps=0;}
      lastTap=n;taps++;
      if(taps>=3){taps=0;adminMode=true;render();}
      break;
    case 'studentMode':adminMode=false;render();break;
    case 'logout':T=null;try{localStorage.removeItem(KEY+'_t');}catch(x){}db.session=null;save();adminMode=false;tab='dash';q='';render();break;
    case 'closeM':closeModal();break;
    case 'tab':tab=el.getAttribute('data-t');q='';render();break;
    case 'addStu':modalAddStu();break;
    case 'manage':manage(id);break;
    case 'adj':
      s=byId(id);if(!s){break;}
      n=Math.floor(Number($('#amt').value));
      if(!n||n<=0){toast('اكتب مبلغا صحيحا');break;}
      n=n*Number(el.getAttribute('data-s'));
      if(s.balance+n<0){toast('الرصيد لا يكفي للخصم');break;}
      s.balance+=n;
      s.tx.push({t:n,note:'تعديل من الإدارة',ts:Date.now()});
      addLog('تعديل رصيد '+s.name+' ('+(n>0?'+':'')+n+' ج.م)');
      save();manage(id);refreshPane();toast('تم تعديل الرصيد ✓');
      break;
    case 'saveNote':
      s=byId(id);if(!s){break;}
      s.note=$('#nt').value.trim().slice(0,300);
      save();refreshPane();toast('تم حفظ الملاحظة ✓');
      break;
    case 'addExam':{
      s=byId(id);if(!s){break;}
      var t=$('#et').value.trim(),sc=Number($('#es').value),mx=Number($('#em').value);
      if(!t||$('#es').value===''||!isFinite(sc)||sc<0||!isFinite(mx)||mx<=0||sc>mx){toast('راجع بيانات الاختبار');break;}
      s.exams.push({id:uid(),title:t,score:sc,max:mx,ts:Date.now()});
      addLog('درجة جديدة لـ '+s.name+': '+t);
      save();manage(id);toast('تمت إضافة الدرجة ✓');
      break;}
    case 'delExam':
      s=byId(id);if(!s){break;}
      s.exams=s.exams.filter(function(e){return e.id!==el.getAttribute('data-e');});
      save();manage(id);
      break;
    case 'delStu':
      s=byId(id);if(!s){break;}
      if(!confirm('حذف الطالب "'+s.name+'" نهائيا؟')){break;}
      db.students=db.students.filter(function(x){return x.id!==id;});
      addLog('تم حذف الطالب '+s.name);save();refreshPane();toast('تم الحذف');
      break;
    case 'mark':{
      s=byId(id);if(!s){break;}
      var now=Date.now(),l=lastAtt(s),rec={status:el.getAttribute('data-st'),by:db.session.sup,ts:now};
      if(l&&dayKey(l.ts)===dayKey(now)){s.att[s.att.length-1]=rec;}else{s.att.push(rec);}
      addLog(s.name+': '+(rec.status==='present'?'حاضر':'غائب')+' (المشرف '+rec.by+')');
      save();refreshPane();toast(rec.status==='present'?'تم تسجيل الحضور ✓':'تم تسجيل الغياب');
      break;}
    case 'genCodes':{
      n=Math.max(1,Math.min(50,parseInt($('#cn').value,10)||1));
      for(var i=0;i<n;i++){db.codes.push({code:genCode(),used:false,ts:Date.now()});}
      addLog('تم توليد '+n+' كود شحن');save();refreshPane();toast('تم توليد '+n+' كود ✓');
      break;}
    case 'credits':
      openModal('<div class="cr"><div class="cr-in"><div class="cr-crown">&#128081;</div><div class="cr-t">تصميم وتطوير</div><div class="cr-n">By: Mohnad</div><a class="cr-p" href="https://wa.me/201143563348" target="_blank" rel="noopener">+201143563348</a><div class="cr-s">للتواصل عبر واتساب</div></div></div><div class="sw-t">🎨 اختار ألوان المنصة</div><div class="sw">'+Object.keys(THEMES).map(function(k){return '<button data-act="theme" data-id="'+k+'" style="background:'+THEMES[k][1]+'" aria-label="'+THEMES[k][0]+'"></button>';}).join('')+'</div>');
      break;
    case 'warn':
      s=byId(id);v=el.getAttribute('data-r');n=2;
      if(!v){v=($('#wr').value||'').trim();n=Math.max(1,Math.min(10,Math.floor(Number($('#wp').value)||2)));}
      if(!s||!v){break;}
      s.beh.push({ts:Date.now(),r:v.slice(0,60),p:n,k:uid()});
      addLog('تنبيه سلوك للطالب '+s.name+': '+v);save();manage(id);refreshPane();
      toast(needF(s)?'⚠️ وصل 3 تنبيهات: كلّم ولي الأمر':'اتسجل التنبيه');break;
    case 'delWarn':
      s=byId(id);if(!s){break;}v=el.getAttribute('data-k');
      s.beh=s.beh.filter(function(b){return b.k!==v;});save();manage(id);refreshPane();break;
    case 'savePP':
      s=byId(id);if(!s){break;}v=norm($('#ppn').value);
      if(v&&!/^\d{8,15}$/.test(v)){toast('الرقم غير صحيح');break;}
      s.pp=v;save();manage(id);refreshPane();toast('اتحفظ ✓');break;
    case 'theme':applyTheme(id);toast('اتغيّرت الألوان ✓');break;
    case 'moreAtt':attLimit+=300;refreshPane();break;
    case 'clrLog':
      if(window.confirm('تمسح كل سجل النشاطات؟')){db.log=[];save();refreshPane();toast('تم مسح السجل ✓');}
      break;
    case 'copy':copyText(el.getAttribute('data-v'));break;
    case 'copyAll':{
      var av=db.codes.filter(function(c){return !c.used;}).map(function(c){return c.code;});
      if(!av.length){toast('لا توجد أكواد متاحة');break;}
      copyText(av.join(NL));
      break;}
    case 'delVid':
      if(!confirm('حذف هذه المحاضرة؟')){break;}
      db.videos=db.videos.filter(function(x){return x.id!==id;});
      save();refreshPane();toast('تم حذف المحاضرة');
      break;
    case 'play':
      v=db.videos.filter(function(x){return x.id===id;})[0];
      if(!v){break;}
      if(!canWatch(v)){toast('المحاضرة مقفولة');break;}
      openModal('<h3 class="h" style="padding-left:30px">'+esc(v.title)+'</h3><div class="player">'+embed(v.url)+'</div>');
      break;
    case 'unlock':
      s=byId(db.session?db.session.id:'');
      v=db.videos.filter(function(x){return x.id===id;})[0];
      if(!s||!v){break;}
      if(canWatch(v)){act('play',el);break;}
      if(s.balance<PRICE){toast('رصيدك لا يكفي، اشحن محفظتك أولا');break;}
      s.balance-=PRICE;s.unlocked.push(v.id);
      s.tx.push({t:-PRICE,note:'فتح محاضرة: '+v.title,ts:Date.now()});
      addLog(s.name+' فتح محاضرة '+v.title);
      save();render();toast('تم فتح المحاضرة ✓');
      break;
    case 'pubAnn':{
      var tx=$('#at').value.trim();
      if(!tx){toast('اكتب نص الإعلان');break;}
      db.announce={text:tx.slice(0,500),ts:Date.now()};
      addLog('تم نشر إعلان عام');save();refreshPane();toast('تم نشر الإعلان ✓');
      break;}
    case 'clrAnn':
      db.announce={text:'',ts:0};save();refreshPane();toast('تمت إزالة الإعلان');
      break;
    default:break;
  }
}
document.addEventListener('click',function(e){
  if(e.target.id==='ov'){closeModal();return;}
  var t=e.target.closest('[data-act]');
  if(t){act(t.getAttribute('data-act'),t);}
});
document.addEventListener('input',function(e){
  if(e.target.id==='sq'){
    q=e.target.value;
    var l=$('#slist');
    if(l){l.innerHTML=rows();}
  }
});

var forms={
  studentLogin:function(f){
    var h=sid(f.elements.fcode.value,f.elements.fphone.value);
    fetch(DB_URL+'/students/'+h+'.json',{cache:'no-store'})
    .then(function(r){if(!r.ok){throw new Error('x');}return r.json();})
    .then(function(rec){
      var e=$('#err');
      if(!rec){if(e){e.textContent='الكود أو رقم الموبايل غير صحيح';}return;}
      db.session={role:'student',id:h};save();
      return pull(false).then(function(){render();});
    })
    .catch(function(){var e=$('#err');if(e){e.textContent='تعذر الاتصال بالسيرفر، حاول تاني';}});
  },
  adminLogin:function(f){
    if(Date.now()<lockUntil){$('#err').textContent='محاولات كثيرة، انتظر 30 ثانية';return;}
    var em=f.elements.fu.value.trim(),pw=f.elements.fpw.value,sp=f.elements.fsup.value.trim();
    if(!sp){$('#err').textContent='اكتب اسم المشرف';return;}
    fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw,returnSecureToken:true})})
    .then(function(r){return r.json();})
    .then(function(j){
      var e=$('#err');
      if(!j.idToken){
        fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0;}
        var m=(j.error&&j.error.message)||'';
        if(e){e.textContent=/INVALID|EMAIL_NOT_FOUND|MISSING_PASSWORD|MISSING_EMAIL|TOO_MANY/.test(m)||!m?'بيانات الدخول غير صحيحة':'مشكلة في Firebase: '+m;}return;
      }
      fails=0;setTok(j);
      db.session={role:'admin',sup:sp.slice(0,40)};
      return pull(true).then(function(){
        if(remoteEmpty&&localHasData()){synced={};remoteEmpty=false;}
        addLog('دخول المشرف '+sp);save();adminMode=false;tab='dash';render();
      });
    })
    .catch(function(er){var e=$('#err');if(e){e.textContent='تعذر الاتصال ('+(er&&er.message?er.message:er)+')';}});
  },
  recharge:function(f){
    var code=norm(f.elements.fcode.value).toUpperCase();
    if(!/^[A-Z0-9-]{4,30}$/.test(code)){toast('الكود غير صحيح');return;}
    getJ('/codes/'+code+'.json').then(function(rc){
    db.codes=(rc&&typeof rc==='object'&&rc.code)?[{code:String(rc.code),ts:Number(rc.ts)||0,used:rc.used===true,by:rc.by||'',usedAt:Number(rc.usedAt)||0}]:[];
    var s=byId(db.session.id),c=null,i;
    if(!s){return;}
    for(i=0;i<db.codes.length;i++){if(db.codes[i].code===code){c=db.codes[i];break;}}
    if(!c){toast('الكود غير صحيح');return;}
    if(c.used){toast('هذا الكود مستخدم من قبل');return;}
    c.used=true;c.by=s.name;c.usedAt=Date.now();
    s.balance+=PRICE;
    s.tx.push({t:PRICE,note:'شحن بكود '+c.code,ts:Date.now()});
    addLog(s.name+' شحن المحفظة بكود '+c.code);
    save();render();toast('تم الشحن بنجاح +'+PRICE+' ج.م ✓');
    }).catch(function(){toast('تعذر الاتصال، حاول تاني');});
  },
  addStu:function(f){
    var n=f.elements.fn.value.trim(),p=norm(f.elements.fp.value),c=norm(f.elements.fc.value)||nextCode();
    var b=Math.max(0,Math.floor(Number(f.elements.fb.value)||0));
    if(!n){toast('اكتب اسم الطالب');return;}
    if(!/^\d{8,15}$/.test(p)){toast('رقم الموبايل غير صحيح');return;}
    if(db.students.some(function(s){return s.code===c;})){toast('هذا الكود مستخدم لطالب آخر');return;}
    var pp=norm(f.elements.fpp.value);
    if(pp&&!/^\d{8,15}$/.test(pp)){toast('رقم ولي الأمر غير صحيح');return;}
    db.students.push(mkStudent(n.slice(0,60),p,c,b,pp));
    addLog('تمت إضافة الطالب '+n+' (كود '+c+')');
    save();closeModal();refreshPane();toast('تمت إضافة الطالب ✓ كوده: '+c);
  },
  addVid:function(f){
    var t=f.elements.ft.value.trim(),u=f.elements.fl.value.trim();
    var m=u.match(/src=["']([^"']+)["']/i);
    if(m){u=m[1];}
    if(!t){toast('اكتب عنوان المحاضرة');return;}
    if(!/^https?:\/\//i.test(u)){toast('الرابط غير صالح');return;}
    db.videos.push({id:uid(),title:t.slice(0,100),url:u,ts:Date.now()});
    addLog('تم نشر محاضرة '+t);
    save();refreshPane();toast('تم نشر المحاضرة ✓');
  }
};
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||!e.target||e.target.tagName!=='INPUT'){return;}
  var f=e.target.closest('form[data-form]');
  if(!f){return;}
  e.preventDefault();
  if(forms[f.getAttribute('data-form')]){forms[f.getAttribute('data-form')](f);}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');
  if(!f){return;}
  e.preventDefault();
  var h=forms[f.getAttribute('data-form')];
  if(h){h(f);}
});

if(isAdm()&&!T){db.session=null;try{writeRaw(JSON.stringify(db));}catch(e){}}
render();
startSync();
})();
